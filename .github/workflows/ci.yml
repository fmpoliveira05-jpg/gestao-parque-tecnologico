name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build (warnings are treated as errors)
        run: make CFLAGS="-std=c11 -Wall -Wextra -pedantic -Werror -O2"

      - name: Unit tests
        run: make test

      - name: Memory check
        run: make memcheck
